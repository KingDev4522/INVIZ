<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./styles.css" />
    <title>INVIZ Test Page — Search, Form, Modal, Results</title>
  </head>
  <body>
    <header>
      <h1>INVIZ fixture site</h1>
      <nav aria-label="Primary">
        <a href="#search-region">Search</a>
        <a href="#form-region">Application form</a>
        <a href="#results-region">Results</a>
      </nav>
    </header>
    <main id="main">
      <div id="inject-mount"></div>

      <section id="search-region" aria-labelledby="search-h">
        <h2 id="search-h">Search tutorials</h2>
        <label for="search">Search</label>
        <input id="search" name="search" type="search" placeholder="Type your search query" autocomplete="off" />
        <button id="search-btn" type="button">Search</button>
        <ul id="results-list" aria-live="polite"></ul>
      </section>

      <section id="form-region" aria-labelledby="form-h">
        <h2 id="form-h">Application form</h2>
        <form id="application-form" action="#" method="post">
          <label for="f-name">Full name</label>
          <input id="f-name" name="name" type="text" autocomplete="name" required />

          <label for="f-email">Email address</label>
          <input id="f-email" name="email" type="email" autocomplete="email" required />

          <label for="f-phone">Phone number</label>
          <input id="f-phone" name="phone" type="tel" autocomplete="tel" />

          <label for="f-address">Address</label>
          <textarea id="f-address" name="address" rows="2" autocomplete="street-address"></textarea>

          <label for="f-password">Password</label>
          <input id="f-password" name="password" type="password" autocomplete="new-password" required />

          <label for="f-otp">One-time code</label>
          <input id="f-otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" />

          <button id="form-submit" type="submit">Submit Application</button>
        </form>
        <p id="form-status" role="status"></p>
      </section>

      <section aria-labelledby="modal-h">
        <h2 id="modal-h">Dialog demo</h2>
        <button id="open-modal" type="button">Open information dialog</button>
        <dialog id="info-dialog" aria-labelledby="dialog-h">
          <h2 id="dialog-h">Information</h2>
          <p>This dialog traps focus until closed. It opened because you asked.</p>
          <button id="close-modal" type="button">Close dialog</button>
        </dialog>
      </section>

      <section id="results-region" aria-labelledby="results-h">
        <h2 id="results-h">Dynamic results</h2>
        <button id="load-results" type="button">Load results</button>
        <div id="results-container" aria-busy="false"></div>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
